name: Bug report
description: Something doesn't work the way it should.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please **redact anything private** before pasting logs or messages: the log file and `.eml` files contain subjects, addresses and message bodies from your mail.

        Security issue? Don't file it here — use **Security → Report a vulnerability** instead.
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Import …
        2. Open …
        3. See …
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `local-eml version`, or the version shown under Settings → About.
      placeholder: v0.10.1
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - Windows
        - macOS
        - Linux
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: How do you run it?
      options:
        - Installed as a background service (install.sh / install.ps1)
        - Double-click app mode
        - Built from source
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log lines
      description: |
        From `~/.local-eml/logs/local-eml.log` (`%USERPROFILE%\.local-eml\logs\` on Windows). Redact subjects and addresses.
      render: text
  - type: textarea
    id: sample
    attributes:
      label: Sample message
      description: |
        For parsing or rendering bugs, attach a `.eml` that reproduces it with personal content replaced. A message you sent to yourself is ideal. Drag the file into this box.
