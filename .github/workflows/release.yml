name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-web:
    name: Build SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Sync VERSION
        run: make sync-version

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Build SPA
        working-directory: web
        run: npm run build

      - uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 1

  build-binary:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    needs: build-web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: amd64, ext: ''     }
          - { os: linux,   arch: arm64, ext: ''     }
          - { os: darwin,  arch: amd64, ext: ''     }
          - { os: darwin,  arch: arm64, ext: ''     }
          - { os: windows, arch: amd64, ext: '.exe' }
          - { os: windows, arch: arm64, ext: '.exe' }
    steps:
      - uses: actions/checkout@v4

      # Must match ci.yml: shipped binaries statically embed the stdlib, so a
      # pinned 1.25.0 toolchain would bake known-vulnerable crypto/tls and
      # net/http into every release.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web/dist/

      # Regenerates the committed .syso so the icon's version info matches the
      # tag (the checked-in copy may lag a bump).
      - name: Embed Windows resources
        if: matrix.os == 'windows'
        run: make icons

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          OUT=local-eml-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$OUT" ./cmd/local-eml
          ls -lh "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.OUT }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build-binary
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: dist/
          pattern: local-eml-*
          merge-multiple: true

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum local-eml-* > SHA256SUMS
          cat SHA256SUMS

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/local-eml-*
            dist/SHA256SUMS
          generate_release_notes: true
          fail_on_unmatched_files: true
