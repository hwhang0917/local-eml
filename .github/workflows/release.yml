name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  # Build provenance attestations (Sigstore via GitHub OIDC).
  id-token: write
  attestations: write

jobs:
  build-web:
    name: Build SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Sync VERSION
        run: make sync-version

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Build SPA
        working-directory: web
        run: npm run build

      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 1

  build-binary:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    needs: build-web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: amd64, ext: ''     }
          - { os: linux,   arch: arm64, ext: ''     }
          - { os: darwin,  arch: amd64, ext: ''     }
          - { os: darwin,  arch: arm64, ext: ''     }
          - { os: windows, arch: amd64, ext: '.exe' }
          - { os: windows, arch: arm64, ext: '.exe' }
    steps:
      - uses: actions/checkout@v7

      # Must match ci.yml: shipped binaries statically embed the stdlib, so a
      # pinned 1.25.0 toolchain would bake known-vulnerable crypto/tls and
      # net/http into every release.
      - uses: actions/setup-go@v7
        with:
          go-version: stable
          cache: true

      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist/

      # Regenerates the committed .syso so the icon's version info matches the
      # tag (the checked-in copy may lag a bump).
      - name: Embed Windows resources
        if: matrix.os == 'windows'
        run: make icons

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          OUT=local-eml-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$OUT" ./cmd/local-eml
          ls -lh "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.OUT }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    needs: build-binary
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # git-cliff needs the previous tag to bound the notes

      - uses: actions/download-artifact@v8
        with:
          path: dist/
          pattern: local-eml-*
          merge-multiple: true

      # Release notes from Conventional Commits since the previous tag
      # (cliff.toml). GitHub's own generator only sees pull requests, and this
      # repo commits straight to main.
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        with:
          version: v2.13.1
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: dist/RELEASE_NOTES.md

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum local-eml-* > SHA256SUMS
          cat SHA256SUMS

      # SLSA provenance: proves each asset was built by this workflow at this
      # commit. Users check with `gh attestation verify <file> --repo hwhang0917/local-eml`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@v4
        with:
          subject-path: |
            dist/local-eml-*
            dist/SHA256SUMS

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/local-eml-*
            dist/SHA256SUMS
          body_path: dist/RELEASE_NOTES.md
          fail_on_unmatched_files: true

      # Offers the new version to winget as a pull request to
      # microsoft/winget-pkgs from the owner's fork. The action only updates
      # packages that already exist there, and it needs WINGET_TOKEN, a classic
      # PAT with the public_repo scope, so it is skipped until both are set up.
      - name: Publish to winget
        if: env.WINGET_TOKEN != ''
        uses: vedantmgoyal9/winget-releaser@v2
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        with:
          identifier: hwhang0917.LocalEml
          installers-regex: '^local-eml-windows-(amd64|arm64)\.exe$'
          release-notes-url: https://github.com/hwhang0917/local-eml/releases/tag/${{ github.ref_name }}
          token: ${{ secrets.WINGET_TOKEN }}
