name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

# Actions are pinned to full commit hashes: a tag can be moved to different
# code, a hash cannot. Dependabot keeps the pins current (.github/dependabot.yml).
#
# Every job starts read-only. Only the publish job, which creates the release
# and signs the attestations, is given more.
permissions:
  contents: read

jobs:
  build-web:
    name: Build SPA
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Sync VERSION
        run: make sync-version

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Build SPA
        working-directory: web
        run: npm run build

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: web-dist
          path: web/dist/
          if-no-files-found: error
          retention-days: 1

  build-binary:
    name: Build ${{ matrix.os }}/${{ matrix.arch }}
    needs: build-web
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: linux,   arch: amd64, ext: ''     }
          - { os: linux,   arch: arm64, ext: ''     }
          - { os: darwin,  arch: amd64, ext: ''     }
          - { os: darwin,  arch: arm64, ext: ''     }
          - { os: windows, arch: amd64, ext: '.exe' }
          - { os: windows, arch: arm64, ext: '.exe' }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must match ci.yml: shipped binaries statically embed the stdlib, so a
      # pinned 1.25.0 toolchain would bake known-vulnerable crypto/tls and
      # net/http into every release.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: true

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: web-dist
          path: web/dist/

      # Regenerates the committed .syso so the icon's version info matches the
      # tag (the checked-in copy may lag a bump).
      - name: Embed Windows resources
        if: matrix.os == 'windows'
        run: make icons

      - name: Build binary
        env:
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
          CGO_ENABLED: '0'
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          OUT=local-eml-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
          go build -trimpath -ldflags "-s -w -X main.version=$VERSION" -o "$OUT" ./cmd/local-eml
          ls -lh "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.OUT }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 7

  # Finder can't launch a bare downloaded binary (no exec bit, then a Terminal
  # window), so macOS also gets a zipped .app. The bare binary still ships for
  # install.sh and the in-app updater. Needs a macOS runner for iconutil,
  # codesign and ditto.
  bundle-macos:
    name: Bundle macOS ${{ matrix.arch }}
    needs: build-binary
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: local-eml-darwin-${{ matrix.arch }}

      - name: Build app bundle
        run: |
          VERSION=$(tr -d '[:space:]' < VERSION)
          OUT=local-eml-darwin-${{ matrix.arch }}.app.zip
          scripts/macos-bundle.sh local-eml-darwin-${{ matrix.arch }} "$VERSION" "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      # The runner is the host arch, so only that build can actually run.
      - name: Smoke test
        if: matrix.arch == 'arm64'
        run: |
          ditto -x -k "$OUT" extracted
          BIN="extracted/Local Eml.app/Contents/MacOS/local-eml"
          "$BIN" version
          "$BIN" serve --port 17878 &
          PID=$!
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:17878/healthz; then OK=1; break; fi
            sleep 0.5
          done
          kill "$PID"
          test "${OK:-}" = 1

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ env.OUT }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 7

  release:
    name: Publish release
    permissions:
      contents: write
      # Build provenance attestations (Sigstore via GitHub OIDC).
      id-token: write
      attestations: write
    needs: [build-binary, bundle-macos]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # git-cliff needs the previous tag to bound the notes

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist/
          pattern: local-eml-*
          merge-multiple: true

      # Ship the license texts beside the binaries: the project's own GPL-3.0
      # LICENSE, and the notices of every bundled npm package and Go module
      # (the same file the app serves from Settings > Attributions).
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web-dist/

      - name: Add license files
        run: |
          cp LICENSE dist/LICENSE.txt
          cp web-dist/THIRD_PARTY_NOTICES.txt dist/THIRD_PARTY_NOTICES.txt

      # A tag with a suffix (v0.18.0-rc.1) is a release candidate: published as
      # a GitHub pre-release, never marked latest, and kept off winget. Stable
      # users only ever see /releases/latest (install scripts, in-app updater),
      # which skips pre-releases.
      - name: Classify tag
        id: tag
        run: |
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # Release notes from Conventional Commits since the previous tag
      # (cliff.toml). GitHub's own generator only sees pull requests, and this
      # repo commits straight to main.
      - name: Generate release notes
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4
        with:
          version: v2.13.1
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: dist/RELEASE_NOTES.md
          # A stable release counts only stable tags, so v0.18.0's notes cover
          # everything since v0.17.0 rather than just what changed after the
          # last RC. Empty for an RC, which falls back to cliff.toml's pattern
          # and lists what changed since the previous tag of any kind.
          GIT_CLIFF_TAG_PATTERN: ${{ steps.tag.outputs.prerelease == 'false' && '^v[0-9]+\.[0-9]+\.[0-9]+$' || '' }}

      - name: Generate SHA256SUMS
        run: |
          cd dist
          sha256sum local-eml-* > SHA256SUMS
          cat SHA256SUMS

      # SLSA provenance: proves each asset was built by this workflow at this
      # commit. Users check with `gh attestation verify <file> --repo hwhang0917/local-eml`.
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/local-eml-*
            dist/SHA256SUMS

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: |
            dist/local-eml-*
            dist/SHA256SUMS
            dist/LICENSE.txt
            dist/THIRD_PARTY_NOTICES.txt
          body_path: dist/RELEASE_NOTES.md
          fail_on_unmatched_files: true
          prerelease: ${{ steps.tag.outputs.prerelease }}
          make_latest: ${{ steps.tag.outputs.prerelease == 'true' && 'false' || 'true' }}

      # Stable tags only. Offers the new version to winget as a pull request to
      # microsoft/winget-pkgs from the owner's fork. The action only updates
      # packages that already exist there, and it needs WINGET_TOKEN, a classic
      # PAT with the public_repo scope, so it is skipped until both are set up.
      # A winget failure (package not yet in winget-pkgs, moderation hiccup)
      # must not mark the already-published release as failed; re-run the job.
      - name: Publish to winget
        if: env.WINGET_TOKEN != '' && steps.tag.outputs.prerelease == 'false'
        continue-on-error: true
        uses: vedantmgoyal9/winget-releaser@b7370d4d152efdce803a26cc6ca9eee58cb2ad54 # v2
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
        with:
          identifier: hwhang0917.LocalEml
          installers-regex: '^local-eml-windows-(amd64|arm64)\.exe$'
          release-notes-url: https://github.com/hwhang0917/local-eml/releases/tag/${{ github.ref_name }}
          token: ${{ secrets.WINGET_TOKEN }}
