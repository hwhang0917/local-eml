name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # go-version-file would pin the exact 1.25.0 from go.mod, freezing the
      # stdlib at a year of missed security patches; stable tracks the latest
      # patched toolchain, which go.mod's floor still permits.
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -race -count=1

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Sync VERSION into web/package.json
        run: make sync-version

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Build web SPA
        working-directory: web
        run: npm run build
