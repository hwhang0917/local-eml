name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # go-version-file would pin the exact version from go.mod, freezing the
      # stdlib at a year of missed security patches; stable tracks the latest
      # patched toolchain, which go.mod's floor still permits.
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version: stable
          cache: true

      # web/third-party/go-notices.txt feeds THIRD_PARTY_NOTICES.txt; it must
      # list every module in the binary, so a go.mod change has to regenerate it.
      - name: Go license notices up to date
        run: go run scripts/gen-go-notices.go -check

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./... -race -count=1

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Sync VERSION into web/package.json
        run: make sync-version

      - name: Install web deps
        working-directory: web
        run: npm ci

      - name: Build web SPA
        working-directory: web
        run: npm run build
